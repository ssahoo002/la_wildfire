<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>California Wildfire Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="main-container">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="plot-container">
            <svg id="scatterPlot" width="500" height="600"></svg>
        </div>
    </div>
    <div class="button-group">
        <button id="pointsButton" class="active">Points</button>
        <button id="heatmapButton">Heatmap</button>
    </div>
    <div class="dropdown-container">
        <div>
            <label for="incidentSelect">Select Incident:</label>
            <select id="incidentSelect" class="dropdown">
                <option value="2025 Incidents">2025 Incidents</option>
                <option value="All Incidents">All Incidents</option>
            </select>
        </div>
    </div>
    <div class="dropdown-container" style="top: 100px;">
        <label for="colorFieldSelect">Color Points By:</label>
        <select id="colorFieldSelect" class="dropdown"></select>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="map2.js"></script>
</body>
</html>
