<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>California Wildfire Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="dropdowns-container">
        <div class="dropdown-container">
            <label for="yearSelect">Select Year:</label>
            <select id="yearSelect" class="dropdown"></select>
        </div>
        <div class="dropdown-container">
            <label for="incidentSelect">Select Incident:</label>
            <select id="incidentSelect" class="dropdown"></select>
        </div>
        <div class="dropdown-container">
            <label for="colorFieldSelect">Color Points By:</label>
            <select id="colorFieldSelect" class="dropdown"></select>
        </div>
        <div class="button-group">
            <button id="pointsButton" class="active">Points</button>
            <button id="heatmapButton">Heatmap</button>
        </div>
        <h4 id="pointCount">Point(s) Shown: 0</h4>
        <button id="openPopup">Help!</button>
        <div class="popup" id="popup">
            <div class="popup-info">
                <h2>California Wildfires</h2>
                <p>We visualize the extent of California wildfire damage over the past 12 years, with a focus on the recent January 2025 incidents.</p>
                <button id="closePopup">Close</button>
            </div>
        </div>
    

    </div>
    <div class="main-container">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="plot-container">
            <div id="parallelCatsPlot" style="width:100%;height:400px;"></div>
            <div class="checkbox-container" id="parallelCatsCheckboxes" style="margin-top:10px; width:100%;"></div>
        </div>
    </div>
    <div id="visualizations" style="display: flex; gap: 16px; margin-top: 30px;">
        <div id="barPieChartHolder" class="plot-holder">
            <div id="barPieChart" style="width:350px;height:350px;"></div>
            <div class="button-group2">
                <button id="pieChartButton">Pie Chart</button>
                <button id="barChartButton" class="active">Bar Chart</button>
            </div>
        </div>
        <div id="lineChartHolder" class="plot-holder">
            <div id="lineChart" style="width:480px;height:350px;"></div>
        </div>
        <div id="cramersVBarChartHolder" class="plot-holder">
            <div id="cramersVBarChart" style="width:380px;height:350px;"></div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="map2.js"></script>
</body>

</html>
